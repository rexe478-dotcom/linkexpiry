<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LinkExpiry</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves path, query, and hash
      var pathSegmentsToKeep = 1; // '/linkexpiry/' is 1 segment
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var routePath = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/#' + (routePath ? '/' + routePath : '') +
        (l.search ? l.search : '');
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
